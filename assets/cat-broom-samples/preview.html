<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cat + broom sprite samples</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a22; color: #e8e8f0; margin: 24px; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 16px; }
    figure { margin: 0; padding: 12px; background: #252530; border-radius: 8px; }
    figcaption { margin-top: 8px; font-size: 0.9rem; }
    img { width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px; background: #111; }
  </style>
</head>
<body>
  <h1>Jump Game player: calico (3) + <code>calico_cat_broom_sheet.jpg</code> run/jump sheet</h1>
  <div class="grid">
    <figure>
      <img src="cat-broom-sample-1.jpg" alt="Sample 1" />
      <figcaption><strong>1</strong> — Orange tabby, chibi</figcaption>
    </figure>
    <figure>
      <img src="cat-broom-sample-2.jpg" alt="Sample 2" />
      <figcaption><strong>2</strong> — Grey tuxedo butler</figcaption>
    </figure>
    <figure>
      <img src="cat-broom-sample-3.jpg" alt="Sample 3" />
      <figcaption><strong>3</strong> — Calico, riding broom</figcaption>
    </figure>
    <figure>
      <img src="cat-broom-sample-4.jpg" alt="Sample 4" />
      <figcaption><strong>4</strong> — Black janitor + bucket</figcaption>
    </figure>
  </div>
</body>
</html>
